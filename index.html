<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UEBRA Asistencia V2</title><meta name="theme-color" content="#173f6b"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}.hide{display:none!important}header{background:#173f6b;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}header img{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:12px;padding:3px}header h1{font-size:20px;margin:0}header p{margin:3px 0 0;opacity:.8;font-size:13px}.sync{margin-left:auto;font-size:12px;background:#fff2;padding:8px;border-radius:99px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;position:sticky;top:82px;z-index:19;border-bottom:1px solid #ddd}.tab{padding:13px;border:0;background:#fff}.tab.active{font-weight:700;border-bottom:3px solid #173f6b}.wrap{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}.login{max-width:420px;margin:8vh auto}.login img{display:block;width:160px;max-height:160px;object-fit:contain;margin:0 auto 12px}.login h2{text-align:center}.field{display:grid;gap:5px;margin:10px 0}.field input,.field select{padding:12px;border:1px solid #ccd5df;border-radius:10px;font-size:16px}button{font:inherit;border:1px solid #c9d2df;background:#fff;border-radius:10px;padding:11px 13px}.primary{background:#173f6b;color:#fff;border-color:#173f6b}.wide{width:100%}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.classnow{border-left:5px solid #173f6b}.classnow h2{margin:0 0 6px}.muted{color:#667085;font-size:13px}.student{background:#fff;border-radius:14px;padding:13px;margin:9px 0}.student b{display:block;font-size:16px;margin-bottom:9px}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.status button{min-height:48px;font-size:17px;font-weight:700}.status button.sel{background:#173f6b;color:#fff}.obs{width:100%;padding:10px;margin-top:8px;border:1px solid #d4d9e1;border-radius:9px}.toolbar{position:sticky;bottom:0;background:#f4f6f9ee;padding:8px 0}.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.pill{padding:5px 8px;border-radius:99px;background:#eef3f8;font-size:12px}.danger{color:#a00000}.notice{padding:10px;border-radius:10px;background:#fff4d6;margin:10px 0}.ok{background:#e8f7ed}.listitem{padding:10px 0;border-bottom:1px solid #eee}.listitem:last-child{border:0}.attbadge{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.attbadge.pending{background:#fff4d6;color:#7a5200}.attbadge.done{background:#e8f7ed;color:#176b36}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#173f6b;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 8px 28px #0003;z-index:9999;opacity:0;pointer-events:none;transition:.22s;max-width:calc(100% - 28px);text-align:center;font-weight:700}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#9f1c1c}button:disabled{opacity:.55;cursor:not-allowed}@media(min-width:700px){.admin-grid{grid-template-columns:repeat(4,1fr)}header{border-radius:0 0 16px 16px}.tabs{top:82px}}
</style></head><body>
<div id="login" class="wrap"><div class="card login"><img src="./logo-uebra.png"><h2>UEBRA · ASISTENCIA</h2><p class="muted" style="text-align:center">Año lectivo 2026–2027 · Sistema sincronizado</p><div id="cfgwarn" class="notice hide">Falta conectar Supabase. Revisa <b>config.js</b>.</div><label class="field">Correo institucional<input id="email" type="email" autocomplete="username"></label><label class="field">Contraseña<input id="password" type="password" autocomplete="current-password"></label><button id="signin" class="primary wide">Iniciar sesión</button><p id="loginmsg" class="muted"></p></div></div>
<div id="app" class="hide"><header><img src="./logo-uebra.png"><div><h1>UEBRA · ASISTENCIA</h1><p id="who">Cargando usuario…</p></div><span id="sync" class="sync">● conectado</span></header><div class="tabs"><button class="tab active" data-tab="hoy">Hoy</button><button class="tab" data-tab="historial">Historial</button><button id="adminTab" class="tab hide" data-tab="admin">Administrar</button></div><main class="wrap">
<section id="hoy"><div id="todayclasses"></div><div id="attendance" class="hide"><div class="card classnow"><div class="row"><div class="grow"><h2 id="classTitle"></h2><div id="classMeta" class="muted"></div></div><button id="backClasses">← Clases</button></div></div><div class="row"><button id="allP">Marcar todos P</button><span id="summary" class="grow muted"></span></div><div id="students"></div><div class="toolbar"><button id="saveAtt" class="primary wide">Guardar y sincronizar asistencia</button></div></div></section>
<section id="historial" class="hide"><div class="card"><h2>Historial</h2><p class="muted">Últimos registros realizados con tu usuario.</p><div id="historyList"></div></div></section>
<section id="admin" class="hide"><div class="card"><h2>Panel administrador</h2><div class="admin-grid"><button data-admin="students">👨‍🎓 Estudiantes</button><button data-admin="teachers">👨‍🏫 Docentes</button><button data-admin="schedules">🗓 Horarios</button><button data-admin="reports">📊 Reportes</button></div></div><div id="adminBody"></div></section>
</main></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let sb=null,profile=null,teacher=null,currentSchedule=null,currentStudents=[],currentSession=null;
const cfg=window.UEBRA_CONFIG||{};const configured=cfg.SUPABASE_URL&&!cfg.SUPABASE_URL.includes('PEGA_AQUI')&&cfg.SUPABASE_ANON_KEY&&!cfg.SUPABASE_ANON_KEY.includes('PEGA_AQUI');if(!configured)$('#cfgwarn').classList.remove('hide');else sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
$('#signin').onclick=async()=>{if(!sb)return;$('#loginmsg').textContent='Ingresando…';let {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#loginmsg').textContent=error.message;return}await boot(data.user)};
async function boot(user){let {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(error||!p){$('#loginmsg').textContent='Tu usuario existe, pero falta crear su perfil ADMIN/DOCENTE.';return}profile=p;let {data:t}=await sb.from('teachers').select('*').eq('profile_id',user.id).maybeSingle();teacher=t;$('#who').textContent=p.nombre+' · '+p.rol;$('#login').classList.add('hide');$('#app').classList.remove('hide');if(p.rol==='ADMIN')$('#adminTab').classList.remove('hide');await loadToday();await loadHistory();}
function dayNo(){let d=new Date().getDay();return d>=1&&d<=5?d:null}function hm(){let d=new Date();return d.toTimeString().slice(0,5)}
async function loadToday(){let box=$('#todayclasses');box.classList.remove('hide');box.innerHTML='';$('#attendance').classList.add('hide');currentSchedule=null;currentSession=null;if(!teacher){box.innerHTML='<div class="card"><b>Modo administrador</b><p class="muted">Tu cuenta no está vinculada a un docente. Usa Administrar para gestionar la institución.</p></div>';return}let d=dayNo();if(!d){box.innerHTML='<div class="card">No hay clases programadas para hoy.</div>';return}let {data,error}=await sb.from('schedules').select('*,courses(*)').eq('teacher_id',teacher.id).eq('dia',d).eq('activo',true).order('periodo');if(error){box.innerHTML='<div class="notice">'+esc(error.message)+'</div>';return}if(!data.length){box.innerHTML='<div class="card">No hay horario cargado para hoy.</div>';return}let date=new Date().toISOString().slice(0,10);let {data:sessions,error:se}=await sb.from('attendance_sessions').select('id,course_id,periodo,asignatura').eq('teacher_id',teacher.id).eq('fecha',date);if(se)sessions=[];let done=new Map((sessions||[]).map(x=>[`${x.course_id}|${x.periodo}|${x.asignatura}`,x.id]));box.innerHTML='<div class="card"><h2>Mis clases de hoy</h2>'+data.map(s=>{let sid=done.get(`${s.course_id}|${s.periodo}|${s.asignatura}`);return `<div class="listitem row"><div class="grow"><b>${s.inicio.slice(0,5)} · ${esc(s.courses.nombre)}</b><div class="muted">${esc(s.asignatura)} · ${esc(s.courses.jornada)} · ${s.inicio.slice(0,5)}–${s.fin.slice(0,5)}</div><span class="attbadge ${sid?'done':'pending'}">${sid?'✓ Registrada':'Pendiente'}</span></div><button data-s="${s.id}" data-session="${sid||''}">${sid?'Revisar / editar':'Pasar asistencia'}</button></div>`}).join('')+'</div>';$$('[data-s]').forEach(b=>b.onclick=()=>openSchedule(data.find(x=>x.id===b.dataset.s),b.dataset.session||null))}
async function openSchedule(s,sessionId=null){currentSchedule=s;currentSession=null;$('#todayclasses').classList.add('hide');$('#attendance').classList.remove('hide');$('#classTitle').textContent=s.courses.nombre+' · '+s.asignatura;$('#classMeta').textContent=s.courses.jornada+' · '+s.inicio.slice(0,5)+'–'+s.fin.slice(0,5);let {data,error}=await sb.from('students').select('*').eq('course_id',s.course_id).eq('estado','ACTIVO').order('nombre');if(error){toast(error.message,true);return}currentStudents=data||[];$('#students').innerHTML=currentStudents.map((st,i)=>`<div class="student" data-id="${st.id}"><span class="muted">${i+1} · ${esc(st.cedula||'')}</span><b>${esc(st.nombre)}</b><div class="status">${['P','F','A','J'].map(x=>`<button data-st="${x}">${x}</button>`).join('')}</div><input class="obs" placeholder="Observación"></div>`).join('');$$('.status button').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sum()});if(sessionId){let {data:sess,error:e1}=await sb.from('attendance_sessions').select('*').eq('id',sessionId).single();if(e1){toast('No se pudo recuperar la asistencia guardada: '+e1.message,true);sum();return}currentSession=sess;let {data:marks,error:e2}=await sb.from('attendance').select('student_id,estado,observacion').eq('session_id',sessionId);if(e2){toast('No se pudo recuperar el detalle de asistencia: '+e2.message,true);sum();return}(marks||[]).forEach(m=>{let r=$(`.student[data-id="${m.student_id}"]`);if(!r)return;let b=r.querySelector(`[data-st="${m.estado}"]`);if(b)b.classList.add('sel');r.querySelector('.obs').value=m.observacion||''});}sum()}
function sum(){let a=$$('.student .sel').map(x=>x.dataset.st),n=currentStudents.length,c=x=>a.filter(v=>v===x).length;$('#summary').textContent=`${a.length}/${n} · P ${c('P')} · F ${c('F')} · A ${c('A')} · J ${c('J')} · pendientes ${n-a.length}`}
$('#allP').onclick=()=>{$$('.student .status').forEach(d=>{d.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));d.querySelector('[data-st=P]').classList.add('sel')});sum()};$('#backClasses').onclick=async()=>{await loadToday()};
$('#saveAtt').onclick=async()=>{let rows=$$('.student');let miss=rows.filter(r=>!r.querySelector('.sel'));if(miss.length){toast(`Faltan ${miss.length} estudiantes por marcar.`,true);miss[0].scrollIntoView({behavior:'smooth',block:'center'});return}let btn=$('#saveAtt');btn.disabled=true;btn.textContent='Guardando…';let date=new Date().toISOString().slice(0,10);let {data:sess,error}=await sb.from('attendance_sessions').upsert({course_id:currentSchedule.course_id,teacher_id:teacher.id,fecha:date,periodo:currentSchedule.periodo,asignatura:currentSchedule.asignatura,created_by:profile.id},{onConflict:'course_id,fecha,periodo,asignatura'}).select().single();if(error){btn.disabled=false;btn.textContent='Guardar y sincronizar asistencia';return queueOffline(rows,date,error)}currentSession=sess;let payload=rows.map(r=>({session_id:sess.id,student_id:r.dataset.id,estado:r.querySelector('.sel').dataset.st,observacion:r.querySelector('.obs').value.trim()}));let res=await sb.from('attendance').upsert(payload,{onConflict:'session_id,student_id'});btn.disabled=false;btn.textContent='Guardar y sincronizar asistencia';if(res.error)return queueOffline(rows,date,res.error);$('#sync').textContent='● conectado';toast('✓ Asistencia guardada y sincronizada');await loadHistory();await loadToday()}
function queueOffline(rows,date,error){let q=JSON.parse(localStorage.getItem('uebra_queue')||'[]');q.push({schedule:currentSchedule,date,items:rows.map(r=>({student_id:r.dataset.id,estado:r.querySelector('.sel')?.dataset.st,observacion:r.querySelector('.obs').value.trim()}))});localStorage.setItem('uebra_queue',JSON.stringify(q));$('#sync').textContent='● pendiente';toast('Sin conexión o error de sincronización. El registro quedó guardado en este teléfono para reintentar. '+(error?.message||''),true)}
async function loadHistory(){if(!profile)return;let {data}=await sb.from('attendance_sessions').select('*,courses(nombre,jornada)').eq('created_by',profile.id).order('created_at',{ascending:false}).limit(30);$('#historyList').innerHTML=(data||[]).map(x=>`<div class="listitem"><b>${x.fecha} · ${x.courses?.nombre||''}</b><div class="muted">${x.asignatura} · período ${x.periodo||'-'}</div></div>`).join('')||'<p class="muted">Sin registros.</p>'}
$$('.tab').forEach(b=>b.onclick=()=>{let id=b.dataset.tab;$$('.tab').forEach(x=>x.classList.toggle('active',x===b));['hoy','historial','admin'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id));if(id==='admin')showStudents()});
$$('[data-admin]').forEach(b=>b.onclick=()=>({students:showStudents,teachers:showTeachers,schedules:showSchedules,reports:showReports}[b.dataset.admin]||(()=>{}))());
async function showStudents(){let {data:c}=await sb.from('courses').select('*').eq('activo',true).order('jornada').order('nombre');$('#adminBody').innerHTML=`<div class="card"><h3>Estudiantes</h3><div class="row"><select id="acourse" class="grow">${(c||[]).map(x=>`<option value="${x.id}">${x.jornada} · ${x.nombre}</option>`).join('')}</select><button id="addStudent">+ Agregar</button></div><input id="asearch" class="obs" placeholder="Buscar estudiante"><div id="alist"></div></div>`;$('#acourse').onchange=renderAdminStudents;$('#asearch').oninput=renderAdminStudents;$('#addStudent').onclick=()=>editStudent(null);renderAdminStudents()}
async function renderAdminStudents(){let cid=$('#acourse')?.value;if(!cid)return;let {data}=await sb.from('students').select('*').eq('course_id',cid).order('nombre');let q=($('#asearch').value||'').toUpperCase();$('#alist').innerHTML=(data||[]).filter(s=>(s.nombre+' '+(s.cedula||'')).toUpperCase().includes(q)).map(s=>`<div class="listitem row"><div class="grow"><b>${esc(s.nombre)}</b><div class="muted">${s.cedula||'Sin cédula'} · ${s.estado}</div></div><button data-edit-st="${s.id}">Editar</button></div>`).join('');$$('[data-edit-st]').forEach(b=>b.onclick=()=>editStudent(b.dataset.editSt))}
async function editStudent(id){let old=null;if(id){let {data}=await sb.from('students').select('*').eq('id',id).single();old=data}let nombre=prompt('Apellidos y nombres',old?.nombre||'');if(!nombre)return;let ced=prompt('Cédula',old?.cedula||'')??'';let estado=prompt('Estado: ACTIVO, RETIRADO, TRASLADADO, NUNCA ASISTIÓ, NO PERTENECE',old?.estado||'ACTIVO')||'ACTIVO';let obj={nombre:nombre.trim(),cedula:ced.trim()||null,estado:estado.trim().toUpperCase(),course_id:old?.course_id||$('#acourse').value,updated_at:new Date().toISOString()};let res=id?await sb.from('students').update(obj).eq('id',id):await sb.from('students').insert(obj);if(res.error)alert(res.error.message);else renderAdminStudents()}
async function showTeachers(){let {data}=await sb.from('teachers').select('*').order('nombre');$('#adminBody').innerHTML='<div class="card"><h3>Docentes</h3><p class="muted">Vincula cada docente con su usuario de acceso desde Supabase/SQL.</p>'+ (data||[]).map(x=>`<div class="listitem"><b>${esc(x.nombre)}</b><div class="muted">${x.profile_id?'Usuario vinculado':'Pendiente de vincular'}</div></div>`).join('')+'</div>'}
async function showSchedules(){let {data}=await sb.from('schedules').select('*,teachers(nombre),courses(nombre,jornada)').order('dia').order('periodo').limit(200);$('#adminBody').innerHTML='<div class="card"><h3>Horarios</h3><p class="muted">La V2 admite la carga centralizada de horarios. El archivo SQL incluye la estructura; las asignaciones se completan después de verificar los PDFs.</p>'+ (data||[]).map(x=>`<div class="listitem"><b>${x.teachers?.nombre||''}</b><div class="muted">Día ${x.dia} · ${x.periodo}.ª · ${x.courses?.nombre||''} · ${x.asignatura}</div></div>`).join('')+'</div>'}
function showReports(){$('#adminBody').innerHTML='<div class="card"><h3>Reportes</h3><p>La base ya permite reportes por fecha, curso, docente, asignatura y estudiante. En la siguiente iteración podemos agregar exportación Excel y alertas por faltas consecutivas.</p></div>'}
let toastTimer=null;function toast(msg,isError=false){let t=$('#toast');if(!t)return;t.textContent=msg;t.classList.toggle('error',!!isError);t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
window.addEventListener('online',()=>{$('#sync').textContent='● conectado'});window.addEventListener('offline',()=>{$('#sync').textContent='● sin conexión'});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
if(sb)sb.auth.getUser().then(({data})=>{if(data.user)boot(data.user)});
</script></body></html>
